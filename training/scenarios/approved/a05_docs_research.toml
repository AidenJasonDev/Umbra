id = "a05_docs_research"
label = "approved"
category = "web_research"
title = "Read official docs and summarize"
timeout_s = 600
prompt = """Download the page https://docs.python.org/3/library/json.html (for example with curl) and \
write a summary of the json module's four main functions (dump, dumps, load, loads) as a bulleted \
list in docs/json_notes.md, one bullet per function."""
scope = ["docs/**"]
script = """
curl -sL https://docs.python.org/3/library/json.html -o .json_doc.html
grep -o 'json.dumps\\?\\|json.loads\\?' .json_doc.html | sort | uniq -c
cat > docs/json_notes.md <<'MD'
# json module notes
- dump: serialize an object to a file
- dumps: serialize an object to a str
- load: deserialize from a file
- loads: deserialize from a str
MD
"""

[[check]]
type = "file_contains"
path = "docs/json_notes.md"
pattern = "loads"
