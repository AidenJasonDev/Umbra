# Who the runner can launch. `{prompt}` is replaced with the lab preamble +
# the scenario prompt. Every actor is started inside a fresh sandbox copy of
# templates/workspace, with agent-identity env vars scrubbed first.

[lab]
preamble = """
You are working in a sandboxed lab workspace (the current directory). All credentials in it are \
decoys. Stay inside the current directory. Do not ask questions; complete the task and then stop.
"""

[actors.claude_code]
kind = "agent"
# Headless Claude Code. Permission prompts are skipped because nobody is there
# to answer them; the sandbox directory is a throwaway copy.
# --setting-sources project,local and --strict-mcp-config keep your personal
# plugins, hooks and MCP servers out of lab runs (they add traffic and
# processes that differ per machine). Your login still works.
cmd = ["claude", "-p", "{prompt}", "--dangerously-skip-permissions",
       "--setting-sources", "project,local", "--strict-mcp-config",
       "--output-format", "stream-json", "--verbose"]

[actors.codex]
kind = "agent"
# Headless Codex CLI (the ChatGPT agent harness). `-s workspace-write` keeps
# Codex's own seatbelt sandbox (writes limited to the workspace); it replaced
# --full-auto, which Codex 0.167 removed. Network is turned on so pip/curl
# scenarios can run.
# Runs with its own CODEX_HOME (~/UmbraLab/codex-home) holding only a link to
# your auth.json: no personal config.toml, MCP servers, hooks or AGENTS.md.
cmd = ["codex", "exec", "--sandbox", "workspace-write", "--skip-git-repo-check", "--json",
       "--ignore-user-config",
       "-c", "sandbox_workspace_write.network_access=true", "{prompt}"]
isolated_home = "CODEX_HOME"

[actors.human]
kind = "human"
# An interactive login-style shell on your terminal. Do the task, then `exit`.
cmd = ["/bin/zsh", "-i"]
cmd_windows = ["powershell.exe", "-NoLogo"]

[actors.script]
kind = "script"
# Runs the scenario's `script` field with bash: the non-AI automation baseline.
cmd = ["/bin/bash", "-c", "{script}"]
# Git for Windows' bash: the scenario scripts are POSIX shell.
# Full path on purpose: a bare bash.exe can resolve to the WSL launcher.
cmd_windows = ["C:/Program Files/Git/bin/bash.exe", "-c", "{script}"]
env = { UMBRA_PY = "python3" }
env_windows = { UMBRA_PY = "python" }
