[project]
name = "umbra-train"
version = "0.1.0"
description = "Umbra training lab: capture, label and evaluate AI agent sessions on macOS"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.scripts]
umbra-train = "umbra_train.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["umbra_train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
